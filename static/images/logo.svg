<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" fill="none">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#10E050"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Icon: Dumbbell with lightning bolt -->
  <g transform="translate(15, 10)">
    <!-- Dumbbell Left Weight -->
    <rect x="5" y="18" width="10" height="34" rx="3" fill="url(#neonGrad)" filter="url(#glow)"/>
    <rect x="18" y="24" width="7" height="22" rx="2" fill="#00FF66"/>
    <!-- Dumbbell Bar -->
    <rect x="25" y="32" width="26" height="6" rx="2" fill="#FFFFFF"/>
    <!-- Dumbbell Right Weight -->
    <rect x="51" y="24" width="7" height="22" rx="2" fill="#00FF66"/>
    <rect x="61" y="18" width="10" height="34" rx="3" fill="url(#neonGrad)" filter="url(#glow)"/>
    <!-- Central Lightning Bolt -->
    <polygon points="38,12 30,36 38,36 34,58 48,32 40,32" fill="#00FF66" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <text x="100" y="44" font-family="'Outfit', 'Impact', sans-serif" font-size="28" font-weight="900" letter-spacing="3" fill="#FFFFFF">THE <tspan fill="#00FF66" filter="url(#glow)">POWER</tspan> GYM</text>
  <text x="102" y="66" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="4.5" fill="#A0AEC0">UNLEASH PURE STRENGTH</text>
</svg>
